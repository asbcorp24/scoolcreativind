name: Classroom Remote Android Student

on:
  push:
    branches: [ main ]
    paths:
      - "classroom-remote/android-student/**"
      - ".github/workflows/classroom-remote-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: classroom-remote/android-student
        run: gradle --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          cp classroom-remote/android-student/app/build/outputs/apk/debug/app-debug.apk              SHKIVR-Student-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHKIVR-Student-Android
          path: SHKIVR-Student-Android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload classroom-remote-v1.0.0             SHKIVR-Student-Android-debug.apk             --repo ${{ github.repository }}             --clobber
