name: Classroom Remote Windows Clients

on:
  push:
    paths:
      - "classroom-remote/client/**"
      - ".github/workflows/classroom-remote-windows.yml"
  pull_request:
    paths:
      - "classroom-remote/client/**"

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt downloader
        shell: pwsh
        run: python -m pip install --upgrade aqtinstall

      - name: Install Qt 6
        shell: pwsh
        run: |
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia qtwebsockets --outputdir C:\Qt

      - name: Configure vcpkg manifest
        shell: pwsh
        working-directory: classroom-remote/client
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not available on the runner"
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        working-directory: classroom-remote/client
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        working-directory: classroom-remote/client
        run: cmake --build build --config Release --parallel 2
