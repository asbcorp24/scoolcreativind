name: Classroom Remote Windows Clients

permissions:
  contents: write

concurrency:
  group: classroom-remote-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "classroom-remote/client/**"
      - "classroom-remote/server/**"
      - ".github/workflows/classroom-remote-windows.yml"
  pull_request:
    paths:
      - "classroom-remote/client/**"

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python build helpers
        shell: pwsh
        run: python -m pip install --upgrade aqtinstall pillow

      - name: Generate Windows icons
        shell: pwsh
        working-directory: classroom-remote/client
        run: python tools/generate_icons.py

      - name: Install Qt 6
        shell: pwsh
        run: |
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia qtwebsockets --outputdir C:\Qt

      - name: Configure vcpkg manifest
        shell: pwsh
        working-directory: classroom-remote/client
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not available on the runner"
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        working-directory: classroom-remote/client
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        working-directory: classroom-remote/client
        run: cmake --build build --config Release --parallel 2

      - name: Run codec tests
        shell: pwsh
        working-directory: classroom-remote/client/build
        run: |
          $qtBin = "C:\Qt\6.8.3\msvc2022_64\bin"
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          $env:PATH = "$qtBin;$vcpkgBin;$env:PATH"
          ctest -C Release --output-on-failure

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build bundled LAN server
        shell: pwsh
        working-directory: classroom-remote/server
        run: |
          go mod tidy
          go mod download
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -mod=mod -trimpath -ldflags="-s -w" -o "..\client\build\classroom-server.exe" .

      - name: Deploy Qt runtime
        shell: pwsh
        working-directory: classroom-remote/client
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path "$dist\teacher" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\student" | Out-Null
          Copy-Item "build\Release\ClassroomTeacher.exe" "$dist\teacher\"
          Copy-Item "build\Release\ClassroomStudent.exe" "$dist\student\"
          Copy-Item "build\classroom-server.exe" "$dist\teacher\"
          & "C:\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" --release "$dist\teacher\ClassroomTeacher.exe"
          & "C:\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" --release "$dist\student\ClassroomStudent.exe"
          $vcpkgBins = @(
            (Join-Path $PWD "vcpkg_installed\x64-windows\bin"),
            (Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin")
          )
          foreach ($vcpkgBin in $vcpkgBins) {
            if (Test-Path $vcpkgBin) {
              Get-ChildItem "$vcpkgBin\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName "$dist\teacher\" -Force
                Copy-Item $_.FullName "$dist\student\" -Force
              }
            }
          }

          $required = @(
            "ClassroomTeacher.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6WebSockets.dll"
          )
          foreach ($name in $required) {
            if (-not (Test-Path "$dist\teacher\$name")) {
              throw "Missing teacher runtime file: $name"
            }
          }
          if (-not (Test-Path "$dist\student\ClassroomStudent.exe")) {
            throw "Missing ClassroomStudent.exe"
          }

          Write-Host "Teacher top-level runtime:"
          Get-ChildItem "$dist\teacher" -File | Select-Object -ExpandProperty Name
          Write-Host "Student top-level runtime:"
          Get-ChildItem "$dist\student" -File | Select-Object -ExpandProperty Name

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build separate Windows installers
        shell: pwsh
        working-directory: classroom-remote/client
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force -Path "dist\installers" | Out-Null
          & $iscc "installer\teacher.iss"
          & $iscc "installer\student.iss"
          if (-not (Test-Path "dist\installers\ClassroomTeacher-Setup.exe")) { throw "Teacher installer missing" }
          if (-not (Test-Path "dist\installers\ClassroomStudent-Setup.exe")) { throw "Student installer missing" }

      - name: Upload Windows clients
        uses: actions/upload-artifact@v4
        with:
          name: classroom-remote-windows
          path: classroom-remote/client/dist
          if-no-files-found: error

      - name: Replace Windows package in release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "classroom-remote-v1.0.0"
          $asset = "ClassroomRemote-Windows-Full-Interactive-GUI.zip"
          $shaAsset = "$asset.sha256"
          $work = Join-Path $env:RUNNER_TEMP "classroom-release-refresh"

          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          Push-Location $work

          # Берём текущий полный пакет, чтобы сохранить Windows Server и служебные файлы.
          gh release download $tag --repo "${{ github.repository }}" --pattern $asset

          Expand-Archive -Path $asset -DestinationPath extracted -Force
          $root = Join-Path $work "extracted\ClassroomRemote-Windows-Full-Interactive-GUI"
          if (-not (Test-Path $root)) {
            throw "Release archive has unexpected structure"
          }

          # Полностью заменяем только свежие Teacher и Student.
          Remove-Item "$root\Teacher" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$root\Student" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$root\Teacher" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Student" | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\classroom-remote\client\dist\teacher\*" "$root\Teacher\" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\classroom-remote\client\dist\student\*" "$root\Student\" -Recurse -Force

          @'
          {
            "server_url": "http://200.165.236.80:8080",
            "lesson_id": "101",
            "display_name": "Преподаватель"
          }
          '@ | Set-Content -Path "$root\Teacher\config.json" -Encoding UTF8

          @'
          {
            "server_url": "http://200.165.236.80:8080",
            "lesson_id": "101",
            "display_name": "Ученик"
          }
          '@ | Set-Content -Path "$root\Student\config.json" -Encoding UTF8

          Remove-Item $asset -Force
          Compress-Archive -Path "$root" -DestinationPath $asset -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content -Path $shaAsset -Encoding ASCII

          gh release upload $tag $asset $shaAsset --repo "${{ github.repository }}" --clobber

          $teacherSetup = "$env:GITHUB_WORKSPACE\classroom-remote\client\dist\installers\ClassroomTeacher-Setup.exe"
          $studentSetup = "$env:GITHUB_WORKSPACE\classroom-remote\client\dist\installers\ClassroomStudent-Setup.exe"
          gh release upload $tag $teacherSetup $studentSetup --repo "${{ github.repository }}" --clobber

          Pop-Location
