name: Classroom Remote VC Runtime

on:
  push:
    paths:
      - ".github/workflows/classroom-remote-vc-runtime.yml"
  workflow_dispatch:

jobs:
  package-runtime:
    runs-on: windows-latest
    steps:
      - name: Package MSVC runtime
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "vc-runtime"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $roots = @(
            $env:VCToolsRedistDir,
            "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Redist\MSVC",
            "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Redist\MSVC",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $copied = 0
          foreach ($root in $roots) {
            Get-ChildItem $root -Recurse -File -Include "vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","concrt140.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" } |
              ForEach-Object {
                Copy-Item $_.FullName $out -Force
                $copied++
              }
          }

          if ($copied -eq 0) {
            throw "MSVC x64 runtime DLLs were not found"
          }
          Get-ChildItem $out -File | Select-Object -ExpandProperty Name

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-remote-vc-runtime
          path: vc-runtime/*
          if-no-files-found: error
